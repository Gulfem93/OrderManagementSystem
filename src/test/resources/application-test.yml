# Testler gerçek MySQL yerine bellekte çalışan H2 veritabanını kullanır
spring:
  datasource:
    url: jdbc:h2:mem:oms-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  seed:
    enabled: false
