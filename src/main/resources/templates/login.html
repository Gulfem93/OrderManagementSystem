<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <header></header>
    <main>
        <div class="container">
            <form th:action="@{/login}" method="post" class="form_login">
                <div class="form_header">
                    <h1 class="label_login">Welcome Back</h1>
                    <p class="subtitle">Log in to manage your orders</p>
                </div>

                <div th:if="${param.error}" class="alert alert_error">Invalid e-mail or password.</div>
                <div th:if="${param.logout}" class="alert alert_success">You have been logged out.</div>
                <div th:if="${param.registered}" class="alert alert_success">Account created. You can log in now.</div>

                <div class="field">
                    <label for="userEmail">E-mail</label>
                    <input type="email" id="userEmail" name="userEmail" placeholder="user@gmail.com" required autofocus />
                </div>

                <div class="field">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" name="userPassword" placeholder="••••••••" required />
                </div>

                <button type="submit">Log In</button>

                <p class="switch_link">Don't have an account? <a th:href="@{/signup}">Sign up</a></p>
            </form>
        </div>
    </main>
    <footer></footer>
</body>
</html>
