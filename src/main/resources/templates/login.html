<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Sipariş Yönetim Sistemi</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="card">
    <div class="brand">
        <div class="brand-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8l-9-5-9 5 9 5 9-5z"/>
                <path d="M3 8v8l9 5 9-5V8"/>
                <path d="M12 13v8"/>
            </svg>
        </div>
        <div>
            <h1>Sipariş Yönetim Sistemi</h1>
            <p>Devam etmek için giriş yapın</p>
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-error" role="alert">
        The email address or password is incorrect.
    </div>
    <div th:if="${param.registered}" class="alert alert-success" role="status">
        Registration was successful. You can now log in.
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">
        You have successfully logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="userEmail">E-posta</label>
        <input type="email" id="userEmail" name="userEmail" placeholder="ornek@firma.com"
               autocomplete="email" required autofocus>

        <label for="userPassword">Şifre</label>
        <input type="password" id="userPassword" name="userPassword" placeholder="••••••"
               autocomplete="current-password" minlength="6" required>

        <button type="submit">Giriş Yap</button>
    </form>

    <div class="footer">
        Don't have an account? <a th:href="@{/signup}">Kayıt olun</a>
    </div>
</main>
</body>
</html>
