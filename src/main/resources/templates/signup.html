<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <header></header>
    <main>
        <div class="container">
            <form th:action="@{/signup}" th:object="${userData}" method="post" class="form_signup">
                <div class="form_header">
                    <h1 class="label_signup">Create Account</h1>
                    <p class="subtitle">Sign up to start managing your orders</p>
                </div>

                <div class="field">
                    <label for="userRole">Role</label>
                    <select id="userRole" name="userRole">
                        <option value="OWNER">Owner</option>
                        <option value="CUSTOMER">Customer</option>
                    </select>
                </div>

                <div class="row">
                    <div class="field" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}">
                        <label for="userName">Name</label>
                        <input type="text" th:field="*{userName}" id="userName" name="userName" placeholder="John" required />
                    </div>
                    <div class="field" th:if="${#fields.hasErrors('userSurname')}" th:errors="*{userSurname}">
                        <label for="userSurname">Surname</label>
                        <input type="text" id="userSurname" th:field="*{userSurname}" name="userSurname" placeholder="Doe" required />
                    </div>
                </div>

                <div class="field" th:if="${#fields.hasErrors('userEmail')}" th:errors="*{userEmail}">
                    <label for="userEmail">E-mail</label>
                    <input type="email" id="userEmail"  th:field="*{userEmail}" name="userEmail" placeholder="user@gmail.com" required />
                </div>

                <div class="field" th:if="${#fields.hasErrors('userPassword')}" th:errors="*{userPassword}">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" th:field="*{userPassword}" name="userPassword" placeholder="••••••••" required />
                </div>

                <div class="field" th:if="${#fields.hasErrors('userPhone')}" th:errors="*{userPhone}">
                    <label for="userPhone">Phone <span class="optional">(optional)</span></label>
                    <input type="tel" id="userPhone" name="userPhone" th:field="*{userPhone}" placeholder="05XX XXX XX XX" />
                </div>

                <button type="submit">Sign Up</button>

                <p class="switch_link">Already have an account? <a th:href="@{/login}">Log in</a></p>
            </form>
        </div>
    </main>
    <footer></footer>
</body>
</html>
