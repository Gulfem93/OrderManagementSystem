<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <header></header>
    <main>
        <form th:action="@{/signup}" method="post">
            <label for="userRole">ROLE</label>
            <select id="userRole" name="userRole">
                <option value="OWNER">Owner</option>
                <option value="CUSTOMER">Customer</option>
            </select>
            <div>
                <label for="userName">User Name</label>
                <input type="text" id="userName" name="userName" placeholder="user" required />
            </div>
            <div>
                <label for="userSurname">User Surname</label>
                <input type="text" id="userSurname" name="userSurname" placeholder="Surname" required />
            </div>
            <div>
                <label for="userEmail">E-mail</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="user@gmail.com" required />
            </div>

            <div>
                <label for="userPassword">Password</label>
                <input type="password" id="userPassword" name="userPassword" placeholder="*********" required />
            </div>
            
            <div>
                <label for="userPhone">Phone</label>
                <input type="tel" id="userPhone" name="userPhone" placeholder="05XX XXX XX XX" />
            </div>

            <button type="submit">SIGNUP</button>
        </form>
    </main>

    <footer></footer>
</body>
</html>
