<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <header></header>
    <main>
        <form th:action="@{/login}" method="post">
            <div>
                <label for="userName">User Name</label>
                <input type="text" id="username" name="username" placeholder="user" required />
            </div>
            <div>
                <label for="userSurname">User Surname</label>
                <input type="text" id="userSurname" name="userSurname" placeholder="Surname" required />
            </div>
            <div>
                <label for="userEmail">E-mail</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="user@gmail.com" required />
            </div>

            <div>
                <label for="userPassword">Password</label>
                <input type="password" id="userPassword" name="userPassword" placeholder="*********" required />
            </div>
            
            <button type="submit">SIGNUP</button>
        </form>
    </main>

    <footer></footer>
</body>
</html>
