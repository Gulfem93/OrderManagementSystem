<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <header></header>
    <main>
        <div class="container">
            <form th:action="@{/signup}" th:object="${userData}" method="post" class="form_signup">
                <div class="form_header">
                    <h1 class="label_signup">Create Account</h1>
                    <p class="subtitle">Sign up to start managing your orders</p>
                </div>

                <div class="field">
                    <label for="userRole">Role</label>
                    <select id="userRole" th:field="*{userRole}" required>
                        <option value="" disabled th:selected="${userData.userRole == null}">Select a role</option>
                        <option th:value="OWNER">Owner</option>
                        <option th:value="CUSTOMER">Customer</option>
                    </select>
                </div>

                <div class="field" id="companyField" hidden>
                    <label for="companyName">Company Name</label>
                    <input type="text" th:field="*{companyName}" placeholder="Acme Ltd." required disabled />
                    <span class="alert alert_error"
                        th:if="${#fields.hasErrors('companyName')}"
                        th:errors="*{companyName}"></span>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="userName">Name</label>
                        <input type="text" th:field="*{userName}" id="userName" name="userName" placeholder="John" required />
                    </div>
                    <div class="field">
                        <label for="userSurname">Surname</label>
                        <input type="text" id="userSurname" th:field="*{userSurname}" name="userSurname" placeholder="Doe" required />
                    </div>
                </div>

                <div class="field">
                    <label for="userEmail">E-mail</label>
                    <input type="email" th:field="*{userEmail}" placeholder="user@gmail.com" required />
                    <span class="alert alert_error"
                        th:if="${#fields.hasErrors('userEmail')}"
                        th:errors="*{userEmail}"></span>
                </div>

                <div class="field">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" th:field="*{userPassword}" name="userPassword" placeholder="••••••••" required />
                </div>

                <div class="field">
                    <label for="userPhone">Phone <span class="optional">(optional)</span></label>
                    <input type="tel" id="userPhone" name="userPhone" th:field="*{userPhone}" placeholder="05XX XXX XX XX" />
                </div>

                <button type="submit">Sign Up</button>

                <p class="switch_link">Already have an account? <a th:href="@{/login}">Log in</a></p>
            </form>
        </div>
    </main>
    <footer></footer>
    <script>
        (function () {
            const role = document.getElementById("userRole");
            const companyField = document.getElementById("companyField");
            const companyName = document.getElementById("companyName");

            function toggleCompany() {
                const isOwner = role.value === "OWNER";
                companyField.hidden = !isOwner;
                companyName.disabled = !isOwner;
            }

            role.addEventListener("change", toggleCompany);
            toggleCompany();
        })();
    </script>
</body>
</html>
