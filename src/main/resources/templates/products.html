<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isOwner} ? 'Products & Stock' : 'Shop'">Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <a class="brand" th:href="@{/}">
            <span class="brand_logo">OM</span>
            <span class="brand_name">Order Management</span>
        </a>

        <!-- OWNER MENÜSÜ -->
        <nav class="menu" th:if="${isOwner}">
            <a class="menu_item" th:href="@{/}">
                <svg viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>
                <span>Dashboard</span>
            </a>
            <a class="menu_item" th:href="@{/orders}">
                <svg viewBox="0 0 24 24"><path d="M6 2h12l2 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6l2-4zm0 4h12M9 10h6M9 14h6"/></svg>
                <span>Orders</span>
            </a>
            <a class="menu_item active" th:href="@{/products}">
                <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>
                <span>Products &amp; Stock</span>
            </a>
            <a class="menu_item" th:href="@{/customers}">
                <svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
                <span>Customers</span>
            </a>
            <a class="menu_item" th:href="@{/reports}">
                <svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 6-6"/></svg>
                <span>Reports</span>
            </a>
        </nav>

        <!-- CUSTOMER MENÜSÜ -->
        <nav class="menu" th:unless="${isOwner}">
            <a class="menu_item" th:href="@{/}">
                <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
                <span>Home</span>
            </a>
            <a class="menu_item active" th:href="@{/products}">
                <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>
                <span>Shop</span>
            </a>
            <a class="menu_item" th:href="@{/orders}">
                <svg viewBox="0 0 24 24"><path d="M6 2h12l2 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6l2-4zm0 4h12M9 10h6M9 14h6"/></svg>
                <span>My Orders</span>
            </a>
            <a class="menu_item" th:href="@{/profile}">
                <svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
                <span>Account</span>
            </a>
        </nav>
    </aside>

    <div class="content">
        <header class="topbar">
            <h1 class="page_title" th:text="${isOwner} ? 'Products & Stock' : 'Shop'">Products</h1>

            <div class="dropdown">
                <button type="button" class="dropdown_btn" aria-haspopup="true">
                    <span class="avatar"
                          th:text="${#strings.isEmpty(userData.userName)} ? '?' : ${#strings.toUpperCase(#strings.substring(userData.userName, 0, 1))}">?</span>
                    <span class="dropdown_label" th:text="${userData.userName}">User</span>
                    <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="dropdown_content">
                    <div class="dropdown_header">
                        <span class="user_name" th:text="${userData.userName} + ' ' + (${userData.userSurname} ?: '')">User</span>
                        <span class="user_email" th:text="${userData.userEmail}">user@mail.com</span>
                        <span class="user_role" th:text="${userData.userRole}">ROLE</span>
                    </div>
                    <a th:href="@{/orders}" th:text="${isOwner} ? 'All Orders' : 'My Orders'">My Orders</a>
                    <a th:href="@{/profile}">Account Details</a>
                    <hr>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="logout_btn">Logout</button>
                    </form>
                </div>
            </div>
        </header>

        <main>
            <div th:if="${param.added}" class="notice notice_success">Product added successfully.</div>

            <!-- ============ OWNER: ÜRÜN EKLEME FORMU ============ -->
            <section class="panel" th:if="${isOwner}">
                <h2 class="panel_title">Add Product</h2>

                <form th:action="@{/products}" th:object="${productData}" method="post" class="product_form" novalidate>
                    <div class="field">
                        <label for="productCode">Product Code</label>
                        <input type="text" id="productCode" th:field="*{productCode}" placeholder="PRD-001" required />
                        <span class="field_error" th:if="${#fields.hasErrors('productCode')}" th:errors="*{productCode}"></span>
                    </div>

                    <div class="field field_wide">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" th:field="*{productName}" placeholder="Wireless Mouse" required />
                        <span class="field_error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></span>
                    </div>

                    <div class="field">
                        <label for="productPrice">Price (₺)</label>
                        <input type="number" id="productPrice" th:field="*{productPrice}" min="0" step="0.01" placeholder="0.00" required />
                        <span class="field_error" th:if="${#fields.hasErrors('productPrice')}" th:errors="*{productPrice}"></span>
                    </div>

                    <div class="field">
                        <label for="productStock">Stock</label>
                        <input type="number" id="productStock" th:field="*{productStock}" min="0" step="1" placeholder="0" required />
                        <span class="field_error" th:if="${#fields.hasErrors('productStock')}" th:errors="*{productStock}"></span>
                    </div>

                    <div class="form_actions">
                        <button type="submit" class="btn_primary">Add Product</button>
                    </div>
                </form>
            </section>

            <!-- ============ ÜRÜN LİSTESİ (iki rol de görür) ============ -->
            <section class="panel">
                <h2 class="panel_title" th:text="${isOwner} ? 'All Products' : 'Available Products'">Products</h2>

                <p class="empty" th:if="${#lists.isEmpty(products)}">No products yet.</p>

                <div class="table_wrap" th:unless="${#lists.isEmpty(products)}">
                    <table class="product_table">
                        <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th class="num">Price</th>
                            <th class="num">Stock</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products}"
                            th:with="stock=${p.productStock ?: 0}">
                            <td class="code" th:text="${p.productCode}">PRD-001</td>
                            <td th:text="${p.productName}">Product</td>
                            <td class="num"
                                th:text="${p.productPrice != null} ? ${#numbers.formatDecimal(p.productPrice, 1, 'POINT', 2, 'COMMA')} + ' ₺' : '-'">0,00 ₺</td>
                            <td class="num">
                                <!-- Owner tam stok sayısını görür, düşük stok vurgulanır -->
                                <span th:if="${isOwner}" class="stock"
                                      th:classappend="${stock <= lowStock} ? 'stock_low'"
                                      th:text="${stock}">0</span>
                                <!-- Customer sadece stokta var/yok görür -->
                                <span th:unless="${isOwner}" class="stock"
                                      th:classappend="${stock > 0} ? 'stock_ok' : 'stock_low'"
                                      th:text="${stock > 0} ? 'In stock' : 'Out of stock'">In stock</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="home_footer"></footer>
    </div>
</div>
</body>
</html>
